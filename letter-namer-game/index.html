<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Namer Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Letter Namer</h1>
  <div id="game-options">
    <label for="uppercase-letters-option">Big Letters</label>
    <input type="checkbox" id="uppercase-letters-option" value="uppercase-letters" checked />
    <label for="lowercase-letters-option">Small Letters</label>
    <input type="checkbox" id="lowercase-letters-option" value="lowercase-letters" />
    <label for="numbers-option">Numbers</label>
    <input type="checkbox" id="numbers-option" value="numbers" />
  </div>
  <div id="letter-box">
    <p id="letter">T</p>
  </div>
  <button id="next">Next Letter</button>
</body>

<script src="script.js"></script>
</html>
